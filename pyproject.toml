[project]
name = "local-rag-knowledge-base"
version = "0.1.0"
description = "A local RAG knowledge base system built with FastAPI, LangChain and Chroma."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
